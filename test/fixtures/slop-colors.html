<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slop Colors Fixture</title>
  <style>
    .gradient-hero-title {
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%); -webkit-background-clip: text; background-clip: text;
      color: transparent;
      font-size: 3rem;
    }
    .ai-blue-card {
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      padding: 1.5rem;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1 class="gradient-hero-title bg-clip-text bg-gradient-to-r from-purple-500 to-indigo-500">AI Powered Futuristic Engine</h1>
  <p>Purple gradient text telltale signature.</p>

  <!-- Generic electric AI blue heading trope -->
  <h2 class="text-blue-500 text-3xl font-bold">Generic Electric Blue Cloud Engine</h2>

  <!-- Generic electric blue/cyan gradients -->
  <div class="ai-blue-card from-blue-500 to-indigo-600 bg-gradient-to-r">
    <p>AI blue-to-indigo gradient container</p>
  </div>

  <div class="from-cyan-400 to-blue-600 bg-gradient-to-r p-4">
    <p>Cyan-to-blue gradient container</p>
  </div>
</body>
</html>
